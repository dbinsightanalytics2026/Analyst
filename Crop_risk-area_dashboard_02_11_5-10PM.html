*{box-sizing:border-box}html,body{height:100%}

nav{width:224px;flex:none;background:var(--side);color:var(--side-ink);padding:22px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}

nav button:hover{background:#ffffff14}nav button[aria-current=page]{background:#e8f1ea;color:#16291f;font-weight:700}nav button:focus-visible,.chip:focus-visible,th button:focus-visible,.lnk:focus-visible,select:focus-visible,input:focus-visible,td.hm:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

h2{font-size:24px;margin:0;font-weight:700}.sub{color:var(--mute);margin:3px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chips span{color:var(--mute);margin-right:4px;font-size:13px}
.chip{all:unset;cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:13px;display:flex;gap:7px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%}.chip[aria-pressed=false]{opacity:.5}.chip[aria-pressed=true]{border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px}

.row{display:grid;grid-template-columns:150px 1fr 78px;gap:10px;align-items:center;padding:5px 0}
.row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}

.bw{background:transparent}.bw u{display:block;height:12px;border-radius:3px;background:var(--stand);position:relative;text-decoration:none}.bw u b{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--vuln)}
.stack{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--line)}.stack s{display:block;text-decoration:none}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:10px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}

.lnk{all:unset;cursor:pointer;color:var(--acc);font-weight:600}.lnk:hover{text-decoration:underline}

.note{margin-top:22px;color:var(--mute);font-size:12.5px;max-width:78ch}

<section class="panel"><h3>Top 10 crops by standing area</h3><p>Crops with no recorded vulnerable area show only the light standing bar.</p>${LEG}${C.map(a=>`<div class="row"><span class="n">${esc(a.k)}</span>${bw(a.s,cx,a.v)}<span class="v">${f(a.s)}</span></div>`).join('')}</section>
<section class="panel"><h3>Top 10 mandals by vulnerable area</h3><p>Only crops with a recorded vulnerable area are counted.</p>${Mn.map(a=>`<div class="row"><span class="n" title="${esc(a.k)}">${esc(a.k.split(' › ')[1])}</span>${bw(a.s,mm,a.v)}<span class="v">${f(a.v)}</span></div>`).join('')}</section>
<section class="panel"><h3>Seasonal and annual crops</h3><p>Standing area by crop type.</p>${Ty.map(a=>`<div class="row"><span class="n">${a.k}</span>${bw(a.s,Math.max(...Ty.map(t=>t.s)),a.v)}<span class="v">${f(a.s)}</span></div>`).join('')}</section></div>
<p class="note">Vulnerable area is recorded only for ${[...ASSESSED].join(', ')}. For all other crops it is blank in the source file, so those crops are shown as not assessed instead of zero.</p>`};
const crop=()=>{const rs=rows(),Ds=[...new Set(R.map(x=>x.d))].sort(),Cs=agg(rs,x=>x.c).sort((a,b)=>b.s-a.s);if(!Cs.find(a=>a.k===st.crop))st.crop=Cs[0]?.k;
const cell=new Map();for(const x of rs){const k=x.c+'|'+x.d;cell.set(k,(cell.get(k)||0)+(st.metric==='s'?x.s:(x.v||0)))}
const mx=Math.max(1,...cell.values());const M=st.metric;
const body=Cs.map(c=>`<tr><td><b>${esc(c.k)}</b></td>${Ds.map(d=>{const v=cell.get(c.k+'|'+d);if(M==='v'&&!ASSESSED.has(c.k))return'<td class="hm na" style="cursor:default">n/a</td>';if(!v)return'<td class="hm" data-crop="'+esc(c.k)+'" style="color:var(--mute)">–</td>';const a=.1+.9*Math.sqrt(v/mx);return`<td class="hm ${c.k===st.crop?'sel':''}" tabindex="0" data-crop="${esc(c.k)}" style="background:color-mix(in srgb,var(--acc) ${a*100}%,transparent);color:${a>.55?'#fff':'inherit'}">${f(v)}</td>`}).join('')}</tr>`).join('');
const sel=rs.filter(x=>x.c===st.crop),SD=agg(sel,x=>x.d).sort((a,b)=>b.s-a.s),smx=SD[0]?.s||1;
return head('Crop-wise data by district','Pick a crop to see its district-wise spread.')+`<div class="tools"><label>Crop <select id="cropsel">${Cs.map(c=>`<option ${c.k===st.crop?'selected':''}>${esc(c.k)}</option>`).join('')}</select></label><div class="seg" role="group" aria-label="Metric"><button data-m="s" aria-pressed="${M==='s'}">Standing area</button><button data-m="v" aria-pressed="${M==='v'}">Vulnerable area</button></div></div>
<section class="panel" style="margin-bottom:18px"><h3>Crop by district (${M==='s'?'standing':'vulnerable'} area, ha)</h3><p>Select a cell or crop to open the detail below. Darker means more area.</p><div class="tw"><table><thead><tr><th>Crop</th>${Ds.map(d=>`<th class="r" style="white-space:normal;min-width:84px">${esc(d)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div></section>
<section class="panel"><h3>${esc(st.crop||'')} across districts</h3><p>${ASSESSED.has(st.crop)?'':'Vulnerable area was not recorded for this crop.'}</p>${LEG}${sortable([{h:'District',k:a=>a.k,f:a=>`<b>${esc(a.k)}</b>`},{h:'Mandals',r:1,k:a=>a.m.size,f:a=>a.m.size},{h:'RSKs',r:1,k:a=>a.r.size,f:a=>a.r.size},{h:'Standing (ha)',r:1,d:1,k:a=>a.s,f:a=>f(a.s)},{h:'',f:a=>`<div style="min-width:140px">${bw(a.s,smx,a.v)}</div>`},{h:'Vulnerable (ha)',r:1,k:a=>a.v,f:a=>a.sa?f(a.v):'<span class="na">n/a</span>'},{h:'Vulnerable %',r:1,k:a=>a.sa?a.v/a.sa:-1,f:vp},{h:'Impact mix',f:stack}],SD,'crop')}${IMPLEG}</section>`};
const drill=()=>{const p=st.path,L=p.length;let rs=rows();if(L>0)rs=rs.filter(x=>x.d===p[0]);if(L>1)rs=rs.filter(x=>x.m===p[1]);if(L>2)rs=rs.filter(x=>x.r===p[2]);
const T=agg(rs,()=>1)[0]||{s:0,v:0,sa:0,r:new Set,m:new Set,c:new Set};const lv=['District','Mandal','RSK'][L]||'';
const crumbs=`<div class="crumbs"><button class="lnk" data-go="0">All districts</button>${p.map((x,i)=>`<span>›</span>${i<L-1?`<button class="lnk" data-go="${i+1}">${esc(x)}</button>`:`<b>${esc(x)}</b>`}`).join('')}</div>`;
const kp=`<div class="kpis"><div><b>${f(T.s)}</b><small>Standing area (ha)</small></div><div><b>${f(T.v)}</b><small>Vulnerable area (ha)</small></div><div><b>${pc(T.v,T.sa)||'–'}</b><small>Vulnerable share (assessed)</small></div><div><b>${T.m.size}</b><small>Mandals</small></div><div><b>${T.r.size}</b><small>RSKs</small></div></div>`;
let tbl;
if(L<3){const A=agg(rs,x=>[x.d,x.m,x.r][L]).filter(a=>!st.q||a.k.toLowerCase().includes(st.q.toLowerCase()));const mx=Math.max(1,...A.map(a=>a.s));
const cols=[{h:lv,k:a=>a.k,f:a=>L<2||true?`<button class="lnk" data-dn="${esc(a.k)}">${esc(a.k)}</button>`:''}];
if(L===0)cols.push({h:'Mandals',r:1,k:a=>a.m.size,f:a=>a.m.size});if(L<2)cols.push({h:'RSKs',r:1,k:a=>a.r.size,f:a=>a.r.size});else cols.push({h:'Crops',r:1,k:a=>a.c.size,f:a=>a.c.size});
cols.push({h:'Standing (ha)',r:1,d:1,k:a=>a.s,f:a=>f(a.s)},{h:'',f:a=>`<div style="min-width:130px">${bw(a.s,mx,a.v)}</div>`},{h:'Vulnerable (ha)',r:1,k:a=>a.v,f:a=>a.sa?f(a.v):'<span class="na">n/a</span>'},{h:'Vulnerable %',r:1,k:a=>a.sa?a.v/a.sa:-1,f:vp},{h:'Impact mix',f:stack},{h:'Main crop',k:a=>topCrop(a),f:a=>esc(topCrop(a))});
tbl=sortable(cols,A,'dr'+L)+IMPLEG}
else{const A=rs.filter(x=>!st.q||x.c.toLowerCase().includes(st.q.toLowerCase()));const mx=Math.max(1,...A.map(a=>a.s));
tbl=sortable([{h:'Crop',k:x=>x.c,f:x=>`<b>${esc(x.c)}</b>`},{h:'Crop type',k:x=>x.t,f:x=>x.t},{h:'Impact',k:x=>IMP.indexOf(x.i),f:x=>tag(x.i)},{h:'Standing (ha)',r:1,d:1,k:x=>x.s,f:x=>f(x.s)},{h:'',f:x=>`<div style="min-width:130px">${bw(x.s,mx,x.v||0)}</div>`},{h:'Vulnerable (ha)',r:1,k:x=>x.v??-1,f:x=>x.v==null?'<span class="na">not assessed</span>':f(x.v)}],A,'dr3')}
return head('Drilldown: district, mandal and RSK',L<3?`Select a ${lv.toLowerCase()} to go one level deeper.`:'Crop-level records for this RSK.')+crumbs+kp+`<div class="tools"><input id="q" type="search" placeholder="${L<3?'Search '+lv.toLowerCase():'Search crop'}" value="${esc(st.q)}" aria-label="Search"></div><section class="panel">${tbl}</section>`};
function render(){const y=scrollY,q=document.activeElement?.id==='q';$('#main').innerHTML={dash,crop,drill}[st.view]();document.querySelectorAll('nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.v===st.view)&&b.setAttribute('aria-current','page'));document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.v!==st.view)b.removeAttribute('aria-current')});if(q){const e=$('#q');e.focus();e.setSelectionRange(1e4,1e4)}scrollTo(0,y)}
document.addEventListener('click',e=>{const t=e.target.closest('button,td[data-crop]');if(!t)return;const d=t.dataset;
if(d.v){st.view=d.v;scrollTo(0,0)}else if(d.imp){st.imp.has(d.imp)?(st.imp.size>1&&st.imp.delete(d.imp)):st.imp.add(d.imp)}else if(d.m)st.metric=d.m;else if(d.crop)st.crop=d.crop;else if(d.dn){st.path.push(d.dn);st.q='';scrollTo(0,0)}else if(d.go!==undefined){st.path=st.path.slice(0,+d.go);st.q=''}else if(d.sort){const[id,i]=d.sort.split(':');const s=st.sort[id]||{c:-1,dir:-1};st.sort[id]={c:+i,dir:s.c==+i?-s.dir:(+i===0?1:-1)}}else return;render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('td[data-crop]'))e.target.click()});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.id==='cropsel'){st.crop=e.target.value;render()}});
render();
</script></body></html>
